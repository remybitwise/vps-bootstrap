user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

# ---------------------------------------------------------------------------
# http{} — port 80 only: ACME HTTP-01 challenge + redirect everything else
# to 443. nginx no longer occupies port 443 at all — Reality (sing-box)
# sits on it directly (selfsteal), decides for itself whether it's a VPN
# client or not, and transparently forwards everything else (including the
# ACME redirect from here) to Caddy (127.0.0.1:8446). Details — README,
# "Why Caddy for naive" and "Selfsteal".
# ---------------------------------------------------------------------------
http {
    server_tokens off;   # don't leak the nginx version in headers

    server {
        listen 80;
        server_name REPLACE_WITH_YOUR_NAIVE_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # any other Host on 80 — give no info, just drop the connection
    server {
        listen 80 default_server;
        return 444;
    }
}
