name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          status=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; status=1; }
          done
          exit $status

      - name: shellcheck
        run: |
          status=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            shellcheck -S warning "$f" || status=1
          done
          exit $status

      - name: Python syntax (ast.parse)
        run: |
          for f in $(find . -name '*.py' -not -path './.git/*'); do
            python3 -c "import ast; ast.parse(open('$f').read())" || exit 1
          done

      - name: Validate JSON templates
        run: python3 -m json.tool psiphon.config > /dev/null

      - name: Validate VERSION format (semver)
        run: grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

  # The four jobs below all `needs: lint` (no point burning a deploy on
  # an obvious syntax error) but not each other — they run in parallel,
  # each on its own fresh VM, each starting from its own independent
  # bootstrap.sh deploy (the deploy composite action). That's a few
  # redundant seconds of setup per job traded for wall-clock time overall
  # and for every job's failure meaning exactly one thing — cheap on a
  # public repo's unlimited Actions minutes.

  smoke-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.invalid
      EMAIL: ci@example.com
      SSH_PORT: "2201"
      PSIPHON_EGRESS_REGION: NL
      CLIENT_NAME: citest
      SKIP_CERTBOT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy

      - name: Smoke-test real client connections
        run: sudo env "DOMAIN=$DOMAIN" "CLIENT_NAME=$CLIENT_NAME" bash .github/scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in nginx caddy-naive sing-box wdtt psiphon psiphon-watchdog.service psiphon-watchdog.timer ufw fail2ban; do
            echo "::group::journalctl -u $svc"
            sudo journalctl -u "$svc" --no-pager -n 100 || true
            echo "::endgroup::"
          done

  update-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.invalid
      EMAIL: ci@example.com
      SSH_PORT: "2201"
      PSIPHON_EGRESS_REGION: NL
      CLIENT_NAME: citest
      SKIP_CERTBOT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy

      - name: Add an asymmetric client (Reality only, no naive) before the bare re-run
        run: printf '2\nasymtest\nY\nN\nN\n0\n' | sudo bash manage.sh

      - name: Toggle citest's Reality onto always-direct Google routing, and flip the live selector to direct
        run: |
          printf '5\ncitest\n1\n0\n' | sudo bash manage.sh
          sudo /usr/local/sbin/singbox-google-route direct

      - name: Re-run bootstrap.sh with nothing specified (tests auto-detection)
        run: |
          secrets_before="$(sudo sha256sum /root/.vps-bootstrap-secrets.env)"
          # DOMAIN etc. deliberately not passed — testing auto-detection.
          sudo env "SKIP_CERTBOT=$SKIP_CERTBOT" bash bootstrap.sh
          secrets_after="$(sudo sha256sum /root/.vps-bootstrap-secrets.env)"
          if [ "$secrets_before" != "$secrets_after" ]; then
            echo "ERROR: server-wide Reality keys changed on a re-run that passed nothing"
            exit 1
          fi
          echo "OK: Reality keys unchanged, re-run worked with zero required variables"

      - name: Confirm clients survived the bare re-run untouched
        run: |
          sudo python3 -c "
          import json, sys
          d = json.load(open('/etc/sing-box/config.json'))
          reality = {u['name'] for i in d['inbounds'] if i['tag']=='vless-reality-in' for u in i['users']}
          naive = {u['username'] for i in d['inbounds'] if i['tag']=='naive-in' for u in i['users']}
          ok = True
          if not {'citest', 'asymtest'} <= reality:
              print('ERROR: citest/asymtest missing from Reality after the bare re-run'); ok = False
          if 'citest' not in naive:
              print('ERROR: citest missing from naive after the bare re-run'); ok = False
          if 'asymtest' in naive:
              print('ERROR: asymtest (Reality-only) somehow gained a naive secret across the re-run'); ok = False
          if ok:
              print('OK: citest (Reality+naive) and asymtest (Reality-only) both survived the re-run exactly as they were')
          sys.exit(0 if ok else 1)
          "

      - name: Confirm citest's always-direct Google routing and the live selector choice both survived the bare re-run
        run: |
          sudo python3 -c "
          import json, sys
          d = json.load(open('/etc/sing-box/config.json'))
          ok = any(r.get('auth_user') == ['citest'] and r.get('outbound') == 'direct' for r in d['route']['rules'])
          print('OK: citest still has its personal direct-route rule after the re-run' if ok else 'ERROR: citest lost its personal direct-route rule across the re-run')
          sys.exit(0 if ok else 1)
          "
          route="$(curl -fsS http://127.0.0.1:9090/proxies/google-out | python3 -c "import json, sys; print(json.load(sys.stdin)['now'])")"
          if [ "$route" = "direct" ]; then
            echo "OK: google-out selector still reads 'direct' after the re-run restarted sing-box (cache_file persisted it)"
          else
            echo "ERROR: google-out reverted to '$route' across the re-run — cache_file did not persist the live choice"
            exit 1
          fi
          sudo /usr/local/sbin/singbox-google-route psiphon

      - name: Prove citest's Google traffic actually takes the direct outbound, not just that the config says so
        run: |
          workdir="$(mktemp -d)"
          sudo python3 - "$workdir" <<'PYEOF'
          import json, sys
          workdir = sys.argv[1]
          env = {}
          with open("/root/.vps-bootstrap-secrets.env") as f:
              for line in f:
                  line = line.strip()
                  if line and "=" in line:
                      k, v = line.split("=", 1)
                      env[k] = v
          client = {
              "inbounds": [{"type": "socks", "tag": "in", "listen": "127.0.0.1", "listen_port": 19003}],
              "outbounds": [{
                  "type": "vless", "tag": "out", "server": "127.0.0.1", "server_port": 443,
                  "uuid": env["CLIENT_citest_UUID"], "flow": "xtls-rprx-vision",
                  "tls": {
                      "enabled": True, "server_name": "ci.invalid",
                      "utls": {"enabled": True, "fingerprint": "chrome"},
                      "reality": {"enabled": True, "public_key": env["REALITY_PUBLIC_KEY"], "short_id": env["SHORT_ID"]},
                  },
              }],
              "route": {"final": "out"},
          }
          json.dump(client, open(f"{workdir}/client.json", "w"))
          PYEOF
          sudo sing-box run -c "$workdir/client.json" > "$workdir/client.log" 2>&1 &
          pid=$!
          sleep 2
          # youtube.com, unlike gstatic.com (lib.sh's generic connectivity
          # target), is actually in the google-geosite/geoip rule_set this
          # toggle keys off — gstatic wouldn't exercise the rule at all.
          # Looping the request keeps a connection open long enough for the
          # /connections poll below to catch it — a single request can
          # close before the next curl even starts.
          (for i in 1 2 3 4 5; do curl -x socks5h://127.0.0.1:19003 -sS -o /dev/null --max-time 10 "https://www.youtube.com/?ci=$i"; done) &
          curl_pid=$!
          chain=""
          for i in 1 2 3 4 5 6; do
            chain="$(curl -fsS http://127.0.0.1:9090/connections | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for c in d['connections']:
              if 'youtube' in (c['metadata'].get('host') or ''):
                  print(','.join(c['chains']))
                  break
          ")"
            [ -n "$chain" ] && break
            sleep 0.5
          done
          wait "$curl_pid" 2>/dev/null || true
          sudo kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          sudo rm -rf "$workdir"
          if [ "$chain" = "direct" ]; then
            echo "OK: citest's youtube.com connection actually took the direct outbound (chain: $chain)"
          else
            echo "ERROR: citest's youtube.com connection took '$chain', not direct — the toggle's config looks right but traffic isn't following it"
            exit 1
          fi

      - name: Remove the asymmetric test client and citest's direct-route toggle
        run: |
          printf '3\nasymtest\nY\nY\nY\n0\n' | sudo bash manage.sh
          printf '5\ncitest\n1\n0\n' | sudo bash manage.sh

      - name: Smoke-test real client connections (after the bare re-run)
        run: sudo env "DOMAIN=$DOMAIN" "CLIENT_NAME=$CLIENT_NAME" bash .github/scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in nginx caddy-naive sing-box wdtt psiphon psiphon-watchdog.service psiphon-watchdog.timer ufw fail2ban; do
            echo "::group::journalctl -u $svc"
            sudo journalctl -u "$svc" --no-pager -n 100 || true
            echo "::endgroup::"
          done

  manage-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.invalid
      EMAIL: ci@example.com
      SSH_PORT: "2201"
      PSIPHON_EGRESS_REGION: NL
      CLIENT_NAME: citest
      SKIP_CERTBOT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy

      - name: Functional-test manage.sh end to end
        run: sudo env "DOMAIN=$DOMAIN" "CLIENT_NAME=$CLIENT_NAME" bash .github/scripts/manage-functional-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in nginx caddy-naive sing-box wdtt psiphon psiphon-watchdog.service psiphon-watchdog.timer ufw fail2ban; do
            echo "::group::journalctl -u $svc"
            sudo journalctl -u "$svc" --no-pager -n 100 || true
            echo "::endgroup::"
          done

  failover-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.invalid
      EMAIL: ci@example.com
      SSH_PORT: "2201"
      PSIPHON_EGRESS_REGION: NL
      CLIENT_NAME: citest
      SKIP_CERTBOT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy

      - name: Test Google direct-fallback failover
        run: sudo env "DOMAIN=$DOMAIN" "CLIENT_NAME=$CLIENT_NAME" bash .github/scripts/failover-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in nginx caddy-naive sing-box wdtt psiphon psiphon-watchdog.service psiphon-watchdog.timer ufw fail2ban; do
            echo "::group::journalctl -u $svc"
            sudo journalctl -u "$svc" --no-pager -n 100 || true
            echo "::endgroup::"
          done

  install-test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.invalid
      EMAIL: ci@example.com
      SSH_PORT: "2201"
      PSIPHON_EGRESS_REGION: NL
      CLIENT_NAME: citest
      SKIP_CERTBOT: "1"
      # Pins install.sh's own internal fetch to this exact commit — so
      # this tests the real curl-from-GitHub one-liner end to end,
      # against what this push actually contains, not whatever the
      # latest tagged release happens to be.
      VPS_BOOTSTRAP_REF: ${{ github.sha }}
    steps:
      # Needed for manage.sh/the test scripts below, not for install.sh
      # itself — that one really does fetch itself and the rest of the
      # repo over the network, from scratch, exactly as a real first run
      # would.
      - uses: actions/checkout@v4

      - name: Set up a real sshd listening on SSH_PORT (for live detection)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          echo "Port ${SSH_PORT}" | sudo tee -a /etc/ssh/sshd_config > /dev/null
          sudo systemctl restart ssh 2>/dev/null || sudo systemctl restart sshd
          sleep 1
          sudo ss -tlnp | grep sshd

      - name: Install via the real one-liner (fetches this exact commit from GitHub)
        # The whole curl-and-process-substitution has to happen inside
        # the sudo'd shell, not before it — a /dev/fd/N opened by this
        # step's own (unprivileged) shell isn't visible once sudo execs
        # into a root process, so `sudo bash <(curl ...)` fails with
        # "No such file or directory" even though the curl itself works.
        run: |
          sudo env "DOMAIN=$DOMAIN" "EMAIL=$EMAIL" "PSIPHON_EGRESS_REGION=$PSIPHON_EGRESS_REGION" \
            "SKIP_CERTBOT=$SKIP_CERTBOT" "VPS_BOOTSTRAP_REF=$VPS_BOOTSTRAP_REF" \
            bash -c 'bash <(curl -fsSL "https://raw.githubusercontent.com/remybitwise/vps-bootstrap/$VPS_BOOTSTRAP_REF/install.sh")'

      - name: Add the test client via manage.sh
        run: printf '2\n%s\nY\nY\nY\n0\n' "${CLIENT_NAME}" | sudo bash manage.sh

      - name: Smoke-test real client connections
        run: sudo env "DOMAIN=$DOMAIN" "CLIENT_NAME=$CLIENT_NAME" bash .github/scripts/smoke-test.sh

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in nginx caddy-naive sing-box wdtt psiphon psiphon-watchdog.service psiphon-watchdog.timer ufw fail2ban; do
            echo "::group::journalctl -u $svc"
            sudo journalctl -u "$svc" --no-pager -n 100 || true
            echo "::endgroup::"
          done
